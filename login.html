<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - Ferretería Los Maestros</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="js/funciones.js" defer></script>
</head>

<body class="body-login">

        <main class="login-wrapper">
        <div class="login-left-column">
            <section class="login-card">
                <div class="login-logo">
                    <span class="logo-texto">Ferretería <strong>Los Maestros</strong></span>
                </div>
                
                <h1>Iniciar sesión</h1>
                <form id="form-login" novalidate>
                    <fieldset>
                        <legend>Formulario de Ingreso</legend>
                        <div class="input-group">
                            <label for="email">Correo electrónico, teléfono o usuario</label>
                            <input type="email" id="email" name="email" placeholder="" autocomplete="email" required>
                        </div>

                        <div class="input-group">
                            <label for="password">Contraseña</label>
                            <input type="password" id="password" name="password" placeholder="" autocomplete="current-password" required>
                        </div>

                        <p class="recuperar-link">
                            <a href="#">¿No puede acceder a su cuenta?</a>
                        </p>

                        <button type="submit" class="btn-submit">Siguiente</button>
                        <p id="confirmacion-login" style="color: green; font-weight: bold; margin-top: 1rem; font-size: 0.85rem;"></p>
                    </fieldset>
                </form>
            </section>

            <div class="login-footer-strip">
                <a href="#">🔍 Opciones de inicio de sesión</a>
            </div>
        </div>

        <section class="login-info">
            <span class="badge-recuerda">¡RECUERDA!</span>
            <h2>Acceso al Sistema General</h2>
            <p>Utilice sus credenciales corporativas asignadas para gestionar stock, catálogos y cuentas corrientes de Ferretería Los Maestros.</p>
        </section>

    </main>
</body>

</html>
